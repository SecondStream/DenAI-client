flutter_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/icon.png"
  min_sdk_android: 21
  web:
    generate: false
  windows:
    generate: true
    image_path: "assets/images/icon.png"
    icon_size: 256 # min:48, max:256, default: 48
  macos:
    generate: false
    image_path: "path/to/image.png"