name: den_ai
description: "DenAI client."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  cached_network_image: ^4.0.4
  dio: ^5.9.2
  drift: ^2.35.2
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_secure_storage: ^11.2.0
  get_it: ^9.2.1
  gpt_markdown: ^1.1.7

  intl: ^0.20.2
  dart_sentencepiece_tokenizer: ^1.0.0

  json_annotation: ^4.12.0
  path: ^1.9.1
